name: Story breath V11

on:
  push:
    paths:
      - '.deploy-story-breath-v11'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply story breathing V11
        run: python .github/scripts/story-breath-v11.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .deploy-story-breath-v11
          git add app/lib/edge-omnivoice-inspired.ts app/page.tsx .deploy-story-breath-v11
          git commit -m "Balance story continuity with adaptive breathing"
          git push
