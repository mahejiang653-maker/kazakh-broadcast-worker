name: Broadcast connector scope V35b

on:
  push:
    paths:
      - '.github/workflows/broadcast-connector-scope-v35b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V35b broadcast connector scope patch
        run: python .github/scripts/broadcast-connector-scope-v35b.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Scope connector cadence refinements to broadcast modes"
          git push
