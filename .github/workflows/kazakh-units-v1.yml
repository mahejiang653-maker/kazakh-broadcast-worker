name: Kazakh unit normalization V1

on:
  push:
    paths:
      - '.deploy-kazakh-units-v1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add high-confidence spoken unit normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/lib/kazakh-speech-normalizer.ts')
          text = path.read_text(encoding='utf-8')
          anchor = '''  // Common news abbreviations that sound better expanded than letter-by-letter.\n'''
          if anchor not in text:
              raise SystemExit('Unit normalization insertion anchor not found.')
          if 'High-confidence measurement forms used frequently in news copy.' in text:
              raise SystemExit('Unit normalization is already installed.')

          block = r'''  // High-confidence measurement forms used frequently in news copy. Expand
  // them in the hidden spoken text before generic number normalization. This
  // mirrors the text-normalization step used by high-quality TTS corpora while
  // leaving the user's visible article untouched.
  text = text
    .replace(/\b(\d{1,12}(?:[.,]\d{1,3})?)\s*км\s*\/\s*сағ(?![\p{L}\p{N}])/giu, "сағатына $1 километр")
    .replace(/\b(\d{1,12}(?:[.,]\d{1,3})?)\s*м\s*\/\s*с(?![\p{L}\p{N}])/giu, "секундына $1 метр")
    .replace(/\b(\d{1,12}(?:[.,]\d{1,3})?)\s*кВт\s*(?:[·⋅*]\s*)?сағ(?![\p{L}\p{N}])/giu, "$1 киловатт сағат");

  text = text.replace(
    /\b(\d{1,12}(?:[.,]\d{1,3})?)\s*(км|м|см|мм)([²³])(?![\p{L}\p{N}])/giu,
    (_match, amount, rawUnit, dimension) => {
      const units: Record<string, string> = {
        "км": "километр",
        "м": "метр",
        "см": "сантиметр",
        "мм": "миллиметр",
      };
      const unit = units[String(rawUnit).toLowerCase()] ?? String(rawUnit);
      return `${amount} ${dimension === "²" ? "шаршы" : "текше"} ${unit}`;
    },
  );

  text = text.replace(
    /\b(\d{1,12}(?:[.,]\d{1,3})?)\s*(кВт|МВт|ГВт|ТВт)(?![\p{L}\p{N}])/giu,
    (_match, amount, rawUnit) => {
      const units: Record<string, string> = {
        "квт": "киловатт",
        "мвт": "мегаватт",
        "гвт": "гигаватт",
        "твт": "тераватт",
      };
      return `${amount} ${units[String(rawUnit).toLowerCase()] ?? String(rawUnit)}`;
    },
  );

  text = text.replace(
    /\b(\d{1,12}(?:[.,]\d{1,3})?)\s*(KB|MB|GB|TB)(?![A-Za-z0-9])/gu,
    (_match, amount, rawUnit) => {
      const units: Record<string, string> = {
        KB: "килобайт",
        MB: "мегабайт",
        GB: "гигабайт",
        TB: "терабайт",
      };
      return `${amount} ${units[String(rawUnit).toUpperCase()] ?? String(rawUnit)}`;
    },
  );

  text = text.replace(
    /\b(\d{1,12}(?:[.,]\d{1,3})?)\s*(kHz|MHz|GHz|THz)(?![A-Za-z0-9])/giu,
    (_match, amount, rawUnit) => {
      const units: Record<string, string> = {
        KHZ: "килогерц",
        MHZ: "мегагерц",
        GHZ: "гигагерц",
        THZ: "терагерц",
      };
      return `${amount} ${units[String(rawUnit).toUpperCase()] ?? String(rawUnit)}`;
    },
  );

  text = text.replace(
    /([+-]?)\s*(\d{1,12}(?:[.,]\d{1,3})?)\s*°\s*[CС](?![\p{L}\p{N}])/giu,
    (_match, sign, amount) => `${sign === "-" ? "минус " : sign === "+" ? "плюс " : ""}${amount} градус Цельсий`,
  );

  text = text.replace(
    /\b(\d{1,12}(?:[.,]\d{1,3})?)\s*(мм|см|км|м|мл|л|кг|г|т|га)(?![\p{L}\p{N}])/giu,
    (_match, amount, rawUnit) => {
      const units: Record<string, string> = {
        "мм": "миллиметр",
        "см": "сантиметр",
        "км": "километр",
        "м": "метр",
        "мл": "миллилитр",
        "л": "литр",
        "кг": "килограмм",
        "г": "грамм",
        "т": "тонна",
        "га": "гектар",
      };
      return `${amount} ${units[String(rawUnit).toLowerCase()] ?? String(rawUnit)}`;
    },
  );

'''
          text = text.replace(anchor, block + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          rm -f .deploy-kazakh-units-v1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/kazakh-speech-normalizer.ts .deploy-kazakh-units-v1
          git commit -m "Normalize common Kazakh news units for speech"
          git push
