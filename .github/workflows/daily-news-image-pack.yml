name: Daily News Image Pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'daily-news-image-pack/news.json'
      - 'daily-news-image-pack/curated_pool.json'
      - 'daily-news-image-pack/full_web_pack_v12.py'
      - 'daily-news-image-pack/requirements.txt'
  schedule:
    - cron: '20 4 * * *'  # 12:20 Beijing time

jobs:
  build-image-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r daily-news-image-pack/requirements.txt

      - name: Full-web recent real-photo search and ZIP
        env:
          IMAGES_PER_NEWS: '3'
          MIN_WIDTH: '1200'
          MIN_HEIGHT: '675'
          MIN_RECENT_YEAR: '2025'
          COMMONS_LIMIT: '60'
          OPENVERSE_LIMIT: '60'
          BING_LIMIT: '60'
        run: python daily-news-image-pack/full_web_pack_v12.py

      - name: Locate ZIP
        id: zip
        shell: bash
        run: |
          ZIP_PATH=$(ls daily-news-image-pack/daily-news-images-*.zip | head -n 1)
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.zip_name }}
          path: ${{ steps.zip.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-pack-manifest
          path: daily-news-image-pack/output/manifest.json
          retention-days: 14
