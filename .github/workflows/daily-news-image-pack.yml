name: Daily News Image Pack

# Legacy image pack performs actual web searches and launches Chromium.
# Keep it available for explicit one-time use, but never run automatically:
# news are locked only at 13:00 Beijing; the old 12:20 cron used stale content.
on:
  workflow_dispatch:

jobs:
  build-image-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r daily-news-image-pack/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verified recent-capture real-photo search and ZIP
        env:
          IMAGES_PER_NEWS: '3'
          MIN_WIDTH: '1200'
          MIN_HEIGHT: '675'
          MIN_RECENT_YEAR: '2025'
          COMMONS_LIMIT: '100'
          BING_LIMIT: '100'
        run: python daily-news-image-pack/full_web_pack_v15.py

      - name: Fill missing slots with robust counted image-search screenshots
        env:
          IMAGES_PER_NEWS: '3'
        run: python daily-news-image-pack/fill_search_thumbnails_v19.py

      - name: Locate ZIP
        id: zip
        shell: bash
        run: |
          ZIP_PATH=$(ls daily-news-image-pack/daily-news-images-*.zip | head -n 1)
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.zip_name }}
          path: ${{ steps.zip.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-pack-manifest
          path: daily-news-image-pack/output/manifest.json
          retention-days: 14
