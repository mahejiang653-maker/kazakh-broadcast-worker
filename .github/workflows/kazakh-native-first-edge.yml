name: Kazakh Native First Edge

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply Kazakh native-first prosody'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply native-first Kazakh prosody
        run: python scripts/apply_kazakh_native_first.py
      - name: Commit native-first Edge improvements
        run: |
          git config user.name "mahejiang653-maker"
          git config user.email "mahejiang653@gmail.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Apply Kazakh phrase-level native prosody"
          git push
