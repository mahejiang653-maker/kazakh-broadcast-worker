name: Period closure V33

on:
  push:
    paths:
      - '.github/workflows/period-closure-v33.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V33 period closure patch
        run: python .github/scripts/period-closure-v33.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Strengthen sentence-final period closure"
          git push
