name: Broadcast comma floor V22

on:
  push:
    paths:
      - '.github/workflows/broadcast-comma-floor-v22.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V22 comma floor patch
        run: python .github/scripts/broadcast-comma-floor-v22.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Raise all news comma minimums to 35ms"
          git push
