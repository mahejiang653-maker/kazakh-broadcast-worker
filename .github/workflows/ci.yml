name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test production build
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live Edge TTS smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kazakh-broadcast-worker.mahejiang653.workers.dev/api/synthesize"
          PAYLOAD='{"text":"Сәлем тораптастар! Бүгінгі маңызды жаңалықтарға назар аударайық.","engine":"edge","voice":"kk-KZ-DauletNeural","preset":"news","speed":1,"edgePitch":0,"edgeVolume":0,"stability":0.5,"similarityBoost":0.75,"style":0,"speakerBoost":true}'
          for attempt in 1 2 3; do
            rm -f /tmp/edge-smoke.bin /tmp/edge-smoke.headers
            status="$(curl --silent --show-error --location --max-time 90               --output /tmp/edge-smoke.bin               --dump-header /tmp/edge-smoke.headers               --write-out '%{http_code}'               --request POST "$URL"               --header 'Content-Type: application/json'               --data "$PAYLOAD" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' /tmp/edge-smoke.headers | tail -1)"
            size="$(wc -c < /tmp/edge-smoke.bin 2>/dev/null || echo 0)"
            echo "Attempt $attempt: HTTP $status · Content-Type $content_type · $size bytes"
            if [[ "$status" == "200" && "$content_type" == audio/mpeg* && "$size" -gt 1000 ]]; then
              echo "Live Edge TTS smoke test passed."
              exit 0
            fi
            echo "Response preview:"
            head -c 600 /tmp/edge-smoke.bin || true
            echo
            sleep 6
          done
          echo "Live Edge TTS smoke test failed after 3 attempts."
          exit 1

      - name: Live Daulet V2 anti-fry smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kazakh-broadcast-worker.mahejiang653.workers.dev/api/synthesize"
          PAYLOAD='{"text":"Бүгінгі хабарлар осымен аяқталды. Бұл оқиғаға қатысты қосымша мәлімет кейін жарияланады.","engine":"edge","voice":"kk-KZ-DauletNeural","preset":"calm","speed":0.9,"edgePitch":0,"edgeVolume":0,"edgeEmotionOverrides":[{"index":1,"emotion":"sad","intensity":0.55}],"stability":0.5,"similarityBoost":0.75,"style":0,"speakerBoost":true}'
          rm -f /tmp/daulet-v2.bin /tmp/daulet-v2.headers
          status="$(curl --silent --show-error --location --max-time 90             --output /tmp/daulet-v2.bin             --dump-header /tmp/daulet-v2.headers             --write-out '%{http_code}'             --request POST "$URL"             --header 'Content-Type: application/json'             --data "$PAYLOAD" || true)"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' /tmp/daulet-v2.headers | tail -1)"
          size="$(wc -c < /tmp/daulet-v2.bin 2>/dev/null || echo 0)"
          echo "Daulet V2: HTTP $status · Content-Type $content_type · $size bytes"
          if [[ "$status" != "200" || "$content_type" != audio/mpeg* || "$size" -le 1000 ]]; then
            echo "Daulet V2 anti-fry smoke test failed."
            head -c 600 /tmp/daulet-v2.bin || true
            echo
            exit 1
          fi
          echo "Daulet V2 anti-fry smoke test passed."
