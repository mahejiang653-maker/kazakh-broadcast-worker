name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test production build
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live Edge TTS smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kazakh-broadcast-worker.mahejiang653.workers.dev/api/synthesize"
          PAYLOAD='{"text":"Сәлем тораптастар! Бүгінгі маңызды жаңалықтарға назар аударайық.","engine":"edge","voice":"kk-KZ-DauletNeural","preset":"news","speed":1,"edgePitch":0,"edgeVolume":0,"stability":0.5,"similarityBoost":0.75,"style":0,"speakerBoost":true}'
          for attempt in 1 2 3; do
            rm -f /tmp/edge-smoke.bin /tmp/edge-smoke.headers
            status="$(curl --silent --show-error --location --max-time 90               --output /tmp/edge-smoke.bin               --dump-header /tmp/edge-smoke.headers               --write-out '%{http_code}'               --request POST "$URL"               --header 'Content-Type: application/json'               --data "$PAYLOAD" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' /tmp/edge-smoke.headers | tail -1)"
            size="$(wc -c < /tmp/edge-smoke.bin 2>/dev/null || echo 0)"
            echo "Attempt $attempt: HTTP $status · Content-Type $content_type · $size bytes"
            if [[ "$status" == "200" && "$content_type" == audio/mpeg* && "$size" -gt 1000 ]]; then
              echo "Live Edge TTS smoke test passed."
              exit 0
            fi
            echo "Response preview:"
            head -c 600 /tmp/edge-smoke.bin || true
            echo
            sleep 6
          done
          echo "Live Edge TTS smoke test failed after 3 attempts."
          exit 1

      - name: Live Daulet V2 anti-fry smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kazakh-broadcast-worker.mahejiang653.workers.dev/api/synthesize"
          PAYLOAD='{"text":"Бүгінгі хабарлар осымен аяқталды. Бұл оқиғаға қатысты қосымша мәлімет кейін жарияланады.","engine":"edge","voice":"kk-KZ-DauletNeural","preset":"calm","speed":0.9,"edgePitch":0,"edgeVolume":0,"edgeEmotionOverrides":[{"index":1,"emotion":"sad","intensity":0.55}],"stability":0.5,"similarityBoost":0.75,"style":0,"speakerBoost":true}'
          rm -f /tmp/daulet-v2.bin /tmp/daulet-v2.headers
          status="$(curl --silent --show-error --location --max-time 90             --output /tmp/daulet-v2.bin             --dump-header /tmp/daulet-v2.headers             --write-out '%{http_code}'             --request POST "$URL"             --header 'Content-Type: application/json'             --data "$PAYLOAD" || true)"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' /tmp/daulet-v2.headers | tail -1)"
          size="$(wc -c < /tmp/daulet-v2.bin 2>/dev/null || echo 0)"
          echo "Daulet V2: HTTP $status · Content-Type $content_type · $size bytes"
          if [[ "$status" != "200" || "$content_type" != audio/mpeg* || "$size" -le 1000 ]]; then
            echo "Daulet V2 anti-fry smoke test failed."
            head -c 600 /tmp/daulet-v2.bin || true
            echo
            exit 1
          fi
          echo "Daulet V2 anti-fry smoke test passed."

      - name: Live Fish S2-style inline focus smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kazakh-broadcast-worker.mahejiang653.workers.dev/api/synthesize"
          PAYLOAD='{"text":"Ресейде жиырма бес адам жараланды. Сондықтан қауіпсіздік шаралары күшейтілді.","engine":"edge","voice":"kk-KZ-DauletNeural","preset":"news","speed":1,"edgePitch":0,"edgeVolume":0,"edgeFineFocus":true,"edgeEmotionOverrides":[],"stability":0.5,"similarityBoost":0.75,"style":0,"speakerBoost":true}'
          rm -f /tmp/fish-focus.bin /tmp/fish-focus.headers
          status="$(curl --silent --show-error --location --max-time 90             --output /tmp/fish-focus.bin             --dump-header /tmp/fish-focus.headers             --write-out '%{http_code}'             --request POST "$URL"             --header 'Content-Type: application/json'             --data "$PAYLOAD" || true)"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' /tmp/fish-focus.headers | tail -1)"
          size="$(wc -c < /tmp/fish-focus.bin 2>/dev/null || echo 0)"
          echo "Fish inline focus: HTTP $status · Content-Type $content_type · $size bytes"
          if [[ "$status" != "200" || "$content_type" != audio/mpeg* || "$size" -le 1000 ]]; then
            echo "Fish inline focus smoke test failed."
            head -c 600 /tmp/fish-focus.bin || true
            echo
            exit 1
          fi
          echo "Fish S2-style inline focus smoke test passed."

      - name: Live VibeVoice-style long-form continuity smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kazakh-broadcast-worker.mahejiang653.workers.dev/api/synthesize"
          node <<'NODE' > /tmp/vibe-payload.json
          const unit = "Бүгін халықаралық жағдай туралы жаңа мәлімет жарияланды. Ресей мен Украинаға қатысты деректер жаңартылды. Сондықтан сарапшылар жағдайды мұқият бақылап отыр. ";
          const text = Array.from({ length: 42 }, (_, index) =>
            `${index + 1}. ${unit}`
          ).join("\n");
          process.stdout.write(JSON.stringify({
            text,
            engine: "edge",
            voice: "kk-KZ-DauletNeural",
            preset: "news",
            speed: 0.7,
            edgePitch: 0,
            edgeVolume: 0,
            edgeFineFocus: true,
            edgeLongFormContinuity: true,
            edgeEmotionOverrides: [],
            stability: 0.5,
            similarityBoost: 0.75,
            style: 0,
            speakerBoost: true
          }));
          NODE
          chars="$(wc -c < /tmp/vibe-payload.json)"
          echo "Vibe payload: $chars bytes"
          rm -f /tmp/vibe-long.bin /tmp/vibe-long.headers
          status="$(curl --silent --show-error --location --max-time 180             --output /tmp/vibe-long.bin             --dump-header /tmp/vibe-long.headers             --write-out '%{http_code}'             --request POST "$URL"             --header 'Content-Type: application/json'             --data-binary @/tmp/vibe-payload.json || true)"
          content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' /tmp/vibe-long.headers | tail -1)"
          size="$(wc -c < /tmp/vibe-long.bin 2>/dev/null || echo 0)"
          echo "Vibe long-form: HTTP $status · Content-Type $content_type · $size bytes"
          if [[ "$status" != "200" || "$content_type" != audio/mpeg* || "$size" -le 1000000 ]]; then
            echo "VibeVoice-style long-form continuity smoke test failed."
            head -c 600 /tmp/vibe-long.bin || true
            echo
            exit 1
          fi
          echo "VibeVoice-style long-form continuity smoke test passed."

      - name: Live Piper Local asset smoke test
        shell: bash
        run: |
          set -euo pipefail
          MODULE="https://cdn.jsdelivr.net/npm/piper-tts-web@1.1.2/dist/piper-tts-web.js"
          CONFIG="https://huggingface.co/rhasspy/piper-voices/resolve/main/kk/kk_KZ/issai/high/kk_KZ-issai-high.onnx.json"
          SAMPLE0="https://huggingface.co/rhasspy/piper-voices/resolve/main/kk/kk_KZ/issai/high/samples/speaker_0.mp3"
          SAMPLE5="https://huggingface.co/rhasspy/piper-voices/resolve/main/kk/kk_KZ/issai/high/samples/speaker_5.mp3"

          module_status="$(curl --silent --show-error --head --location --max-time 45 --output /tmp/piper-module.headers --write-out '%{http_code}' "$MODULE" || true)"
          config_status="$(curl --silent --show-error --location --max-time 45 --output /tmp/piper-config.json --write-out '%{http_code}' "$CONFIG" || true)"
          sample0_status="$(curl --silent --show-error --location --max-time 45 --range 0-511 --output /tmp/piper-sample0.bin --write-out '%{http_code}' "$SAMPLE0" || true)"
          sample5_status="$(curl --silent --show-error --location --max-time 45 --range 0-511 --output /tmp/piper-sample5.bin --write-out '%{http_code}' "$SAMPLE5" || true)"

          echo "Piper assets: module=$module_status config=$config_status sample0=$sample0_status sample5=$sample5_status"
          node -e 'const f=require("fs"); const j=JSON.parse(f.readFileSync("/tmp/piper-config.json","utf8")); if(j.num_speakers!==6) process.exit(1); if(!j.speaker_id_map || Object.keys(j.speaker_id_map).length!==6) process.exit(1); console.log("Piper config confirms 6 speakers.");'

          for status in "$module_status" "$config_status" "$sample0_status" "$sample5_status"; do
            if [[ "$status" != "200" && "$status" != "206" ]]; then
              echo "Piper Local asset smoke test failed."
              exit 1
            fi
          done
          echo "Piper Local asset smoke test passed."
