name: Story sentence breath V13

on:
  push:
    paths:
      - '.deploy-story-sentence-breath-v13'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply story sentence breathing V13
        run: python .github/scripts/story-sentence-breath-v13.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .deploy-story-sentence-breath-v13
          git add app/lib/edge-omnivoice-inspired.ts app/page.tsx .deploy-story-sentence-breath-v13
          git commit -m "Add controlled sentence breathing to story mode"
          git push
