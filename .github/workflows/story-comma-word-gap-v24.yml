name: Story comma and word gap V24

on:
  push:
    paths:
      - '.github/workflows/story-comma-word-gap-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V24 story comma and word-gap patch
        run: python .github/scripts/story-comma-word-gap-v24.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Add 45ms story commas and 25ms word gaps"
          git push
