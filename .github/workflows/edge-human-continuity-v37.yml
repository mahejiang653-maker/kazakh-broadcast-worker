name: Edge human continuity V37

on:
  push:
    paths:
      - '.github/workflows/edge-human-continuity-v37.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply V37 Edge continuity patch
        run: python .github/scripts/edge-human-continuity-v37.py
      - name: Test production build
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts app/api/synthesize/route.ts
          git commit -m "Improve Edge human continuity and MP3 seam handling"
          git push
