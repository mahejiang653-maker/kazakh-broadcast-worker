name: Edge semantic focus V2

on:
  push:
    paths:
      - '.deploy-edge-semantic-focus-v2'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply semantic focus V2
        run: python .github/scripts/edge-semantic-focus-v2.py

      - name: Commit patch
        run: |
          rm -f .deploy-edge-semantic-focus-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts .deploy-edge-semantic-focus-v2
          git commit -m "Add negation and entity action focus"
          git push
