name: Broadcast item closure V8

on:
  push:
    paths:
      - '.deploy-broadcast-item-closure-v8'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply broadcast item closure V8
        run: python .github/scripts/broadcast-item-closure-v8.py

      - name: Commit patch
        run: |
          rm -f .deploy-broadcast-item-closure-v8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/synthesize/route.ts app/page.tsx .deploy-broadcast-item-closure-v8
          git commit -m "Refine broadcast item endings and handoffs"
          git push
