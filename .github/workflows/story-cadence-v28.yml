name: Story cadence V28

on:
  push:
    paths:
      - '.github/workflows/story-cadence-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V28 story cadence patch
        run: python .github/scripts/story-cadence-v28.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Refine story sentence and paragraph cadence"
          git push
