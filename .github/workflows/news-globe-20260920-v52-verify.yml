name: Verify 2026-09-20 Globe V52
on:
  push:
    branches: [main]
    paths:
      - 'public/news-globe-data-20260920-v52-r1.js'
      - 'public/news-globe-run-20260920-v52-r1.html'
      - '.github/scripts/verify-20260920-v52.mjs'
      - '.github/workflows/news-globe-20260920-v52-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: node .github/scripts/verify-20260920-v52.mjs
      - name: Publish verification marker
        run: |
          echo "PASS_13_13_V52_20260920" > public/news-globe-verify-20260920-v52.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news-globe-verify-20260920-v52.txt
          git commit -m "Verify 2026-09-20 V52 globe 13/13" || exit 0
          git push
