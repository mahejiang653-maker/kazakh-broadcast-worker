name: Verify V52 A1 R6 Production
# Full Cesium/Playwright production verification is resource-intensive and
# currently contains pre-Top10 index assumptions. Run manually on a major
# version change or a confirmed production defect, not on every commit.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check current R6 entry
        run: node --test tests/r6-entry.test.mjs tests/r6-overlay-lifecycle.test.mjs tests/r6-china-borders.test.mjs tests/r6-geography.test.mjs tests/r6-imagery-recovery.test.mjs tests/r6-performance.test.mjs tests/r6-place-labels.test.mjs tests/r6-story-borders.test.mjs
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Verify this commit after CI deployment
        run: node .github/scripts/verify-20260920-v52.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify terrain borders and route/area rendering
        run: node .github/scripts/verify-r6-geography.mjs
        env:
          GLOBE_QUICK: '1'
          GLOBE_SIMULATE_TILE_FAILURE: '1'
      - name: Verify borders belong only to the current story
        run: node .github/scripts/verify-r6-story-borders.mjs
      - name: Verify mobile rendering and animation wake-up
        run: node .github/scripts/verify-r6-performance.mjs
      - name: Verify place labels during navigation and camera movement
        run: node .github/scripts/verify-r6-place-labels.mjs
      - name: Save production results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-globe-v52-a1-r6-production-${{ github.sha }}
          path: |
            globe-verify-r6
            globe-verify-r6-geography
            globe-verify-r6-performance
            globe-verify-r6-place-labels
            globe-verify-r6-story-borders
