name: Verify V52 A1 R6 Production
on:
  push:
    branches: [main]
    paths:
      - 'public/news-globe-data-20260920-v52-r1.js'
      - 'public/news-globe-run-20260920-v52-r1.html'
      - 'public/news-globe-v14-v52-camera-breathing-room.js'
      - 'public/news-globe-v52-screen-collision-hotfix.js'
      - 'public/news-globe-v52-flags-overview-clean.js'
      - 'public/news-globe-v52-china-border-ownership.js'
      - 'public/news-globe-v14-v51-scene-engine.js'
      - 'public/news-globe-v14-ui.js'
      - 'public/news-globe-v14-highlight.js'
      - 'public/news-globe-v52-hard-rules.js'
      - 'public/news-globe-v52-geographic-features.js'
      - 'public/news-globe-v52-r6-performance.js'
      - 'public/news-globe-geography-v1.json'
      - 'public/news-globe-detail-borders-v1/**'
      - 'tests/r6-geography.test.mjs'
      - 'tests/r6-china-borders.test.mjs'
      - 'tests/fixtures/r6-world-borders-20261007.geojson'
      - 'tests/r6-overlay-lifecycle.test.mjs'
      - '.github/scripts/verify-20260920-v52.mjs'
      - '.github/scripts/verify-r6-geography.mjs'
      - '.github/scripts/r6-imagery-recovery.mjs'
      - 'tests/r6-imagery-recovery.test.mjs'
      - 'tests/r6-performance.test.mjs'
      - 'tests/r6-place-labels.test.mjs'
      - '.github/scripts/verify-r6-place-labels.mjs'
      - '.github/scripts/verify-r6-performance.mjs'
      - '.github/workflows/news-globe-20260920-v52-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check current R6 entry
        run: node --test tests/r6-entry.test.mjs tests/r6-overlay-lifecycle.test.mjs tests/r6-china-borders.test.mjs tests/r6-geography.test.mjs tests/r6-imagery-recovery.test.mjs tests/r6-performance.test.mjs tests/r6-place-labels.test.mjs
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Verify this commit after CI deployment
        run: node .github/scripts/verify-20260920-v52.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify terrain borders and route/area rendering
        run: node .github/scripts/verify-r6-geography.mjs
        env:
          GLOBE_QUICK: '1'
          GLOBE_SIMULATE_TILE_FAILURE: '1'
      - name: Verify mobile rendering and animation wake-up
        run: node .github/scripts/verify-r6-performance.mjs
      - name: Verify place labels during navigation and camera movement
        run: node .github/scripts/verify-r6-place-labels.mjs
      - name: Save production results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-globe-v52-a1-r6-production-${{ github.sha }}
          path: |
            globe-verify-r6
            globe-verify-r6-geography
            globe-verify-r6-performance
            globe-verify-r6-place-labels
