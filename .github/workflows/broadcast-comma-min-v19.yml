name: Broadcast comma minimum V19

on:
  push:
    paths:
      - '.deploy-broadcast-comma-min-v19'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V19 broadcast comma minimum patch
        run: python .github/scripts/broadcast-comma-min-v19.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .deploy-broadcast-comma-min-v19
          git add app/lib/edge-omnivoice-inspired.ts .deploy-broadcast-comma-min-v19
          git commit -m "Set news comma minimum to 15ms"
          git push
