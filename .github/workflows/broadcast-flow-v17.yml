name: Broadcast flow V17

on:
  push:
    paths:
      - '.deploy-broadcast-flow-v17'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V17 broadcast flow patch
        run: python .github/scripts/broadcast-flow-v17.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .deploy-broadcast-flow-v17
          git add app/lib/edge-omnivoice-inspired.ts app/api/synthesize/route.ts .deploy-broadcast-flow-v17
          git commit -m "Bring story-style sentence closure to news presets"
          git push
