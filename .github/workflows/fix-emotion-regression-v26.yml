name: Fix emotion regression V26

on:
  push:
    paths:
      - '.github/workflows/fix-emotion-regression-v26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore proven short-text emotion planner
        run: python .github/scripts/fix-emotion-regression-v26.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-emotion-director.ts
          git commit -m "Restore short-text emotion analysis behavior"
          git push
