name: Broadcast comma connectors V35

on:
  push:
    paths:
      - '.github/workflows/broadcast-comma-connectors-v35.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V35 broadcast comma and connector patch
        run: python .github/scripts/broadcast-comma-connectors-v35.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Double broadcast comma pauses and refine connector cadence"
          git push
