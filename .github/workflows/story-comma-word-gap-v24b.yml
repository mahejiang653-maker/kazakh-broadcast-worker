name: Story comma and word gap V24b

on:
  push:
    paths:
      - '.github/workflows/story-comma-word-gap-v24b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix V24 render fallback
        run: python .github/scripts/story-comma-word-gap-v24b.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Fix V24 non-story render fallback"
          git push
