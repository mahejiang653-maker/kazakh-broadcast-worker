name: Context dialogue V6

on:
  push:
    paths:
      - '.deploy-context-dialogue-v6'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply V6 context dialogue patch
        run: python .github/scripts/context-dialogue-v6.py

      - name: Commit patch
        run: |
          rm -f .deploy-context-dialogue-v6
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-emotion-director.ts app/lib/edge-omnivoice-inspired.ts app/api/synthesize/route.ts .deploy-context-dialogue-v6
          git commit -m "Add dependency guards and contextual role delivery"
          git push
