name: Broadcast flow V11

on:
  push:
    paths:
      - '.deploy-broadcast-flow-v11'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply broadcast flow V11
        run: python .github/scripts/broadcast-flow-v11.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .deploy-broadcast-flow-v11
          git add app/api/synthesize/route.ts app/lib/edge-omnivoice-inspired.ts app/page.tsx .deploy-broadcast-flow-v11
          git commit -m "Add continuous broadcast presenter flow"
          git push
