name: Verify 2026-09-08 News Globe V52
on:
  push:
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, 'VERIFY_GLOBE_20260908_V52')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run semantic Top1 to Top13 V52 browser verification
        run: |
          mkdir -p globe-verify
          cat > verify-globe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://kazakh-broadcast-worker.mahejiang653.workers.dev/news-globe-run-20260908.html';
          const expectedDate='2026-09-08';
          const expected=[
            {mode:'COUNTRY',focus:'伊朗',loc:'伊朗',primary:'IRN'},
            {mode:'DIPLOMACY_MULTI',focus:null,loc:'英国—美国—乌克兰—俄罗斯',primary:'GBR'},
            {mode:'POINT',focus:'国际原子能机构总部',loc:'国际原子能机构总部',primary:'AUT'},
            {mode:'POINT',focus:'哈瓦那',loc:'哈瓦那',primary:'CUB'},
            {mode:'POINT',focus:'阿布扎比',loc:'阿布扎比',primary:'ARE'},
            {mode:'ATTACK',focus:'卡法鲁曼',loc:'卡法鲁曼',attacker:'ISR',victim:'LBN'},
            {mode:'POINT',focus:'万国宫',loc:'万国宫',primary:'CHE'},
            {mode:'POINT',focus:'新加坡最高法院',loc:'新加坡最高法院',primary:'SGP'},
            {mode:'POINT',focus:'人民大会堂',loc:'人民大会堂',primary:'CHN'},
            {mode:'POINT',focus:'北京',loc:'北京',primary:'CHN'},
            {mode:'POINT',focus:'厦门',loc:'厦门',primary:'CHN'},
            {mode:'POINT',focus:'自治区科技厅',loc:'乌鲁木齐市科学一街353号',primary:'CHN'},
            {mode:'POINT',focus:'乌鲁木齐',loc:'乌鲁木齐',primary:'CHN'}
          ];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          if(!r||!r.ok()) throw new Error('Daily V52 page unreachable');
          await page.waitForFunction(()=>window.NG14?.viewer && (window.NG14?.news?.length===13 || window.NG14?.demo?.length===13),{timeout:90000});
          await page.waitForTimeout(5000);
          const data=await page.evaluate(()=>({date:window.NG14.meta?.date||window.NG14.PAYLOAD?.meta?.date,news:(window.NG14.news||window.NG14.demo||[]).map(n=>({title:n.title,mode:n.sceneMode,focus:n.focusLabel||null,loc:n.location,primary:n.scenePlan?.primaryIso3||null,attacker:n.scenePlan?.attackerIso3||null,victim:n.scenePlan?.victimIso3||null}))}));
          if(data.date!==expectedDate||data.news.length!==13) throw new Error('Wrong daily data '+JSON.stringify(data));
          for(let i=0;i<13;i++){
            const a=data.news[i],e=expected[i];
            for(const k of ['mode','focus','loc','primary','attacker','victim']) if(e[k]!==undefined && a[k]!==e[k]) throw new Error(`Top${i+1} semantic mismatch ${k}: got=${a[k]} expected=${e[k]} :: ${a.title}`);
          }
          await page.evaluate(()=>window.NG14.pause?.());
          const seen=[];
          for(let i=0;i<13;i++){
            const duration=await page.evaluate((idx)=>{const G=window.NG14;G.pause?.();if(typeof G.focus==='function')G.focus(idx,true);else{G.current=idx;G.play?.();}const n=(G.news||G.demo||[])[idx];return Number(G.storyDuration?.(n)||19000);},i);
            await page.waitForTimeout(Math.max(22000,duration+4500));
            const state=await page.evaluate(()=>{const G=window.NG14,n=(G.news||G.demo||[])[G.current??0];return {current:(G.current??0)+1,title:document.querySelector('#title')?.textContent?.trim()||'',location:document.querySelector('#location')?.textContent?.trim()||'',mode:n?.sceneMode||'',focus:n?.focusLabel||null,rawLoc:n?.location||'',primary:n?.scenePlan?.primaryIso3||null,attacker:n?.scenePlan?.attackerIso3||null,victim:n?.scenePlan?.victimIso3||null,viewer:!!G.viewer,sceneDestroyed:G.viewer?.scene?.isDestroyed?.()||false,cameraHeight:G.viewer?.camera?.positionCartographic?.height||0};});
            const e=expected[i];
            if(state.current!==i+1) throw new Error(`Top${i+1} current mismatch ${JSON.stringify(state)}`);
            if(state.title!==data.news[i].title) throw new Error(`Top${i+1} title mismatch ${JSON.stringify(state)}`);
            if(state.mode!==e.mode||state.rawLoc!==e.loc||(e.focus!==undefined&&state.focus!==e.focus)||(e.primary!==undefined&&state.primary!==e.primary)||(e.attacker!==undefined&&state.attacker!==e.attacker)||(e.victim!==undefined&&state.victim!==e.victim)) throw new Error(`Top${i+1} runtime semantic mismatch ${JSON.stringify(state)} expected=${JSON.stringify(e)}`);
            if(!state.location) throw new Error(`Top${i+1} missing displayed location`);
            if(!state.viewer||state.sceneDestroyed||!Number.isFinite(state.cameraHeight)||state.cameraHeight<=0) throw new Error(`Top${i+1} Cesium failure ${JSON.stringify(state)}`);
            seen.push(state);
            await page.screenshot({path:`globe-verify/top-${String(i+1).padStart(2,'0')}.png`,fullPage:true});
          }
          const final=await page.evaluate(()=>({current:(window.NG14.current??0)+1,newsLen:(window.NG14.news||window.NG14.demo||[]).length,date:window.NG14.meta?.date||window.NG14.PAYLOAD?.meta?.date}));
          fs.writeFileSync('globe-verify/report.json',JSON.stringify({url,data,expected,seen,final,pageErrors},null,2));
          if(seen.length!==13||final.current!==13||final.newsLen!==13||final.date!==expectedDate) throw new Error('Did not complete semantic 13/13');
          if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
          await browser.close();
          console.log(JSON.stringify({status:'PASS_SEMANTIC_13_13',seen:seen.length,final},null,2));
          EOF
          node verify-globe.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-globe-20260908-v52-semantic-verification
          path: globe-verify
