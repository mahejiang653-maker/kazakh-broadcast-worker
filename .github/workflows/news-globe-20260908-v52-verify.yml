name: Verify 2026-09-08 News Globe V52
on:
  push:
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, 'VERIFY_GLOBE_20260908_V52')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run full Top1 to Top13 V52 browser verification
        run: |
          mkdir -p globe-verify
          cat > verify-globe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://kazakh-broadcast-worker.mahejiang653.workers.dev/news-globe-run-20260908.html';
          const expectedDate='2026-09-08';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          if(!r||!r.ok()) throw new Error('Daily V52 page unreachable');
          await page.waitForFunction(()=>window.NG14?.viewer && (window.NG14?.news?.length===13 || window.NG14?.demo?.length===13),{timeout:90000});
          await page.waitForTimeout(4500);
          const data=await page.evaluate(()=>({date:window.NG14.meta?.date||window.NG14.PAYLOAD?.meta?.date,len:(window.NG14.news||window.NG14.demo||[]).length,titles:(window.NG14.news||window.NG14.demo||[]).map(x=>x.title)}));
          if(data.date!==expectedDate||data.len!==13) throw new Error('Wrong daily data '+JSON.stringify(data));
          await page.evaluate(()=>window.NG14.pause?.());
          const seen=[];
          for(let i=0;i<13;i++){
            const duration=await page.evaluate((idx)=>{const G=window.NG14;G.pause?.();if(typeof G.focus==='function')G.focus(idx,true);else{G.current=idx;G.play?.();}const n=(G.news||G.demo||[])[idx];return Number(G.storyDuration?.(n)||19000);},i);
            await page.waitForTimeout(Math.max(22000,duration+4500));
            const state=await page.evaluate(()=>({current:(window.NG14.current??0)+1,title:document.querySelector('#title')?.textContent?.trim()||'',location:document.querySelector('#location')?.textContent?.trim()||'',viewer:!!window.NG14.viewer,sceneDestroyed:window.NG14.viewer?.scene?.isDestroyed?.()||false,cameraHeight:window.NG14.viewer?.camera?.positionCartographic?.height||0}));
            if(state.current!==i+1) throw new Error(`Top${i+1} current mismatch ${JSON.stringify(state)}`);
            if(state.title!==data.titles[i]) throw new Error(`Top${i+1} title mismatch ${JSON.stringify(state)}`);
            if(!state.location) throw new Error(`Top${i+1} missing location`);
            if(!state.viewer||state.sceneDestroyed||!Number.isFinite(state.cameraHeight)||state.cameraHeight<=0) throw new Error(`Top${i+1} Cesium failure ${JSON.stringify(state)}`);
            seen.push({top:i+1,title:state.title,location:state.location,cameraHeight:state.cameraHeight});
            await page.screenshot({path:`globe-verify/top-${String(i+1).padStart(2,'0')}.png`,fullPage:true});
          }
          const final=await page.evaluate(()=>({current:(window.NG14.current??0)+1,newsLen:(window.NG14.news||window.NG14.demo||[]).length,date:window.NG14.meta?.date||window.NG14.PAYLOAD?.meta?.date}));
          fs.writeFileSync('globe-verify/report.json',JSON.stringify({url,data,seen,final,pageErrors},null,2));
          if(seen.length!==13||final.current!==13||final.newsLen!==13||final.date!==expectedDate) throw new Error('Did not complete 13/13');
          if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
          await browser.close();
          console.log(JSON.stringify({status:'PASS',seen:seen.length,final},null,2));
          EOF
          node verify-globe.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-globe-20260908-v52-verification
          path: globe-verify
