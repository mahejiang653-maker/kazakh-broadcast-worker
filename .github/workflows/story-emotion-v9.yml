name: Story emotion V9

on:
  push:
    paths:
      - '.deploy-story-emotion-v9'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply story emotion V9
        run: python .github/scripts/story-emotion-v9.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .deploy-story-emotion-v9
          git add app/lib/edge-emotion-director.ts app/api/synthesize/route.ts app/api/edge-emotion-analysis/route.ts app/page.tsx .deploy-story-emotion-v9
          git commit -m "Deepen word-aware story emotion delivery"
          git push
