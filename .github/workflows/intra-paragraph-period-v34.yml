name: Intra-paragraph period V34

on:
  push:
    paths:
      - '.github/workflows/intra-paragraph-period-v34.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V34 intra-paragraph period patch
        run: python .github/scripts/intra-paragraph-period-v34.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Enforce intra-paragraph period closure"
          git push
