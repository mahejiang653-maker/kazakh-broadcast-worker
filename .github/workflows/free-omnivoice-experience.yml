name: Free OmniVoice Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add free preview warmup cache workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Edge preview, warmup and browser cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          route = Path('app/api/omnivoice/route.ts')
          r = route.read_text()
          marker = 'export async function POST(request: Request) {'
          warmup = '''export async function GET() {
            try {
              const response = await fetchWithTimeout(
                `${OMNI_BASE}/`,
                {
                  method: "GET",
                  headers: {
                    Accept: "text/html,application/xhtml+xml",
                    "User-Agent": "kazakh-broadcast-worker-warmup",
                  },
                },
                7000,
              );
              return Response.json(
                {
                  state: response.ok ? "ready" : "warming",
                  upstreamStatus: response.status,
                },
                {
                  status: response.ok ? 200 : 202,
                  headers: { "Cache-Control": "no-store" },
                },
              );
            } catch {
              // Even when the request times out, reaching the Space is enough to trigger a free wake-up.
              return Response.json(
                { state: "warming" },
                { status: 202, headers: { "Cache-Control": "no-store" } },
              );
            }
          }

          '''
          if 'export async function GET()' not in r:
              r = r.replace(marker, warmup + marker)
          route.write_text(r)

          studio = Path('app/components/OmniVoiceStudio.tsx')
          s = studio.read_text()

          old_state = '''  const [generatedAt, setGeneratedAt] = useState("");
          const audioUrlRef = useRef<string | null>(null);
          const textareaRef = useRef<HTMLTextAreaElement | null>(null);'''
          new_state = '''  const [generatedAt, setGeneratedAt] = useState("");
          const [previewUrl, setPreviewUrl] = useState<string | null>(null);
          const [previewStatus, setPreviewStatus] = useState<"idle" | "generating" | "ready" | "error">("idle");
          const [warmupStatus, setWarmupStatus] = useState("正在自动预热 OmniVoice…");
          const [cacheStatus, setCacheStatus] = useState("");
          const audioUrlRef = useRef<string | null>(null);
          const previewUrlRef = useRef<string | null>(null);
          const textareaRef = useRef<HTMLTextAreaElement | null>(null);'''
          if old_state not in s:
              raise SystemExit('state marker not found')
          s = s.replace(old_state, new_state)

          old_effect = '''  useEffect(() => {
            return () => {
              if (audioUrlRef.current) URL.revokeObjectURL(audioUrlRef.current);
            };
          }, []);'''
          new_effect = '''  useEffect(() => {
            let cancelled = false;

            async function warmOmniVoice() {
              try {
                const response = await fetch("/api/omnivoice", {
                  method: "GET",
                  cache: "no-store",
                });
                const payload = (await response.json().catch(() => null)) as
                  | { state?: string }
                  | null;
                if (cancelled) return;
                setWarmupStatus(
                  payload?.state === "ready"
                    ? "OmniVoice 已连接 · 可以直接生成"
                    : "已发送预热请求 · 免费 GPU 正在准备",
                );
              } catch {
                if (!cancelled) setWarmupStatus("已尝试预热 · 免费 GPU 可能仍在唤醒");
              }
            }

            void warmOmniVoice();
            const secondWarmup = window.setTimeout(() => void warmOmniVoice(), 25000);
            return () => {
              cancelled = true;
              window.clearTimeout(secondWarmup);
            };
          }, []);

          useEffect(() => {
            return () => {
              if (audioUrlRef.current) URL.revokeObjectURL(audioUrlRef.current);
              if (previewUrlRef.current) URL.revokeObjectURL(previewUrlRef.current);
            };
          }, []);'''
          if old_effect not in s:
              raise SystemExit('effect marker not found')
          s = s.replace(old_effect, new_effect)

          old_reset = '''  function resetAudio() {
            if (audioUrlRef.current) {
              URL.revokeObjectURL(audioUrlRef.current);
              audioUrlRef.current = null;
            }
            setAudioUrl(null);
            setGeneratedAt("");
          }'''
          new_reset = '''  function resetAudio() {
            if (audioUrlRef.current) {
              URL.revokeObjectURL(audioUrlRef.current);
              audioUrlRef.current = null;
            }
            if (previewUrlRef.current) {
              URL.revokeObjectURL(previewUrlRef.current);
              previewUrlRef.current = null;
            }
            setAudioUrl(null);
            setPreviewUrl(null);
            setPreviewStatus("idle");
            setCacheStatus("");
            setGeneratedAt("");
          }'''
          if old_reset not in s:
              raise SystemExit('reset marker not found')
          s = s.replace(old_reset, new_reset)

          helper_marker = '  async function generate() {'
          helpers = '''  async function createCacheKey(payload: Record<string, unknown>) {
            const source = JSON.stringify({ version: 2, ...payload });
            const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(source));
            return Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
          }

          async function readCachedOmniVoice(key: string) {
            if (!("caches" in window)) return null;
            try {
              const storage = await caches.open("kazakh-omnivoice-v2");
              const request = new Request(`${window.location.origin}/__omnivoice-cache__/${key}`);
              const response = await storage.match(request);
              return response ? await response.blob() : null;
            } catch {
              return null;
            }
          }

          async function writeCachedOmniVoice(key: string, blob: Blob) {
            if (!("caches" in window)) return;
            try {
              const storage = await caches.open("kazakh-omnivoice-v2");
              const request = new Request(`${window.location.origin}/__omnivoice-cache__/${key}`);
              await storage.put(
                request,
                new Response(blob, {
                  headers: {
                    "Content-Type": "audio/wav",
                    "X-Omni-Cached-At": String(Date.now()),
                  },
                }),
              );
            } catch {
              // Cache is an optimization only; generation still works if the browser denies storage.
            }
          }

          function setPreviewBlob(blob: Blob) {
            if (previewUrlRef.current) URL.revokeObjectURL(previewUrlRef.current);
            const nextUrl = URL.createObjectURL(blob);
            previewUrlRef.current = nextUrl;
            setPreviewUrl(nextUrl);
            setPreviewStatus("ready");
          }

          function setOmniBlob(blob: Blob) {
            if (audioUrlRef.current) URL.revokeObjectURL(audioUrlRef.current);
            const nextUrl = URL.createObjectURL(blob);
            audioUrlRef.current = nextUrl;
            setAudioUrl(nextUrl);
            setGeneratedAt(
              new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }),
            );
          }

          async function generateEdgePreview(cleanText: string) {
            const pitchMap: Record<string, number> = {
              "Very Low Pitch / 极低音调": -16,
              "Low Pitch / 低音调": -8,
              "Moderate Pitch / 中音调": 0,
              "High Pitch / 高音调": 8,
              "Very High Pitch / 极高音调": 16,
            };
            const response = await fetch("/api/synthesize", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                text: cleanText,
                engine: "edge",
                voice: gender === "Female / 女" ? "kk-KZ-AigulNeural" : "kk-KZ-DauletNeural",
                preset: style === "Whisper / 耳语" ? "calm" : "news",
                speed,
                edgePitch: pitchMap[pitch] ?? 0,
                edgeVolume: style === "Whisper / 耳语" ? -4 : 0,
              }),
            });
            if (!response.ok) throw new Error("Edge 预览暂时不可用");
            const blob = await response.blob();
            if (!blob.size) throw new Error("Edge 预览没有返回音频");
            return blob;
          }

          '''
          if helper_marker not in s:
              raise SystemExit('generate helper marker not found')
          s = s.replace(helper_marker, helpers + helper_marker, 1)

          generate_pattern = re.compile(r'  async function generate\(\) \{.*?\n  \}\n\n  return \(', re.S)
          new_generate = '''  async function generate() {
            const cleanText = text.trim();
            if (!cleanText) {
              setError("请先输入哈萨克语文本。");
              return;
            }
            if (cleanText.length > MAX_CHARACTERS) {
              setError(`OmniVoice 文本不能超过 ${MAX_CHARACTERS} 个字符。`);
              return;
            }
            if (tagCount > 3) {
              setError("OmniVoice 共享 GPU 较慢，每次最多使用 3 个句尾情绪标签。");
              return;
            }

            const omniPayload = {
              text: cleanText,
              speed,
              steps,
              guidance,
              denoise,
              gender,
              age,
              pitch,
              style,
            };

            setIsGenerating(true);
            setError("");
            resetAudio();

            try {
              const cacheKey = await createCacheKey(omniPayload);
              const cached = await readCachedOmniVoice(cacheKey);
              if (cached?.size) {
                setOmniBlob(cached);
                setCacheStatus("命中本机缓存 · OmniVoice 即刻播放");
                setIsGenerating(false);
                return;
              }

              setCacheStatus("未命中缓存 · 正在后台生成 OmniVoice");
              setPreviewStatus("generating");

              // Start both requests together. Edge normally finishes first while OmniVoice keeps running.
              const omniRequest = fetch("/api/omnivoice", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(omniPayload),
              });
              const previewRequest = generateEdgePreview(cleanText);

              try {
                const previewBlob = await previewRequest;
                setPreviewBlob(previewBlob);
              } catch {
                setPreviewStatus("error");
              }

              const response = await omniRequest;
              if (!response.ok) {
                const payload = (await response.json().catch(() => null)) as { error?: string } | null;
                throw new Error(payload?.error || "OmniVoice 生成失败，请稍后再试。");
              }
              const blob = await response.blob();
              if (!blob.size) throw new Error("OmniVoice 没有返回音频。");
              setOmniBlob(blob);
              setCacheStatus("OmniVoice 已完成 · 已自动保存到本机缓存");
              void writeCachedOmniVoice(cacheKey, blob);
            } catch (caught) {
              setError(
                `${caught instanceof Error ? caught.message : "OmniVoice 免费服务暂时不可用。"}${previewUrlRef.current ? " Edge 预览仍可继续播放。" : ""}`,
              );
            } finally {
              setIsGenerating(false);
            }
          }

          return ('''
          s, count = generate_pattern.subn(new_generate, s, count=1)
          if count != 1:
              raise SystemExit(f'generate replacement count={count}')

          s = s.replace(
              '基于 shyngys879 的 KazakhTTS-OmniVoice 公共 Demo。无需 ElevenLabs 额度，可以直接设计男声或女声、年龄、音高、耳语风格，并调节倍速、质量和推理强度。',
              '基于 shyngys879 的 KazakhTTS-OmniVoice 公共 Demo。现在采用 Edge 秒出预览 + OmniVoice 后台高质生成 + 自动预热/本机缓存；全程不需要 ElevenLabs 额度。',
          )
          s = s.replace(
              '<span>免费共享 GPU</span>\n          <span>男 / 女声设计</span>',
              '<span>Edge 秒出预览</span>\n          <span>自动预热 / 缓存</span>\n          <span>男 / 女声设计</span>',
          )
          s = s.replace(
              '''            <strong>这是公共 Hugging Face 共享 GPU</strong>
            <p>已默认启用 8 步极速档。公共 GPU 仍可能冷启动或排队；不加情绪标签时最快。</p>''',
              '''            <strong>{warmupStatus}</strong>
            <p>打开页面即自动唤醒免费 GPU；点击生成时 Edge 与 OmniVoice 同时启动，先试听 Edge，OmniVoice 完成后自动出现。相同文本和参数再次生成会优先读取本机缓存。</p>''',
          )

          old_button = '''        <button className="generate-button" type="button" onClick={generate} disabled={!text.trim() || isGenerating}>
          <span className="button-icon" aria-hidden="true">
            {isGenerating ? <i className="spinner" /> : <i className="play-triangle" />}
          </span>
          <span>
            <strong>{isGenerating ? "OmniVoice 共享 GPU 正在生成…" : `生成 OmniVoice · ${speed.toFixed(2)}×`}</strong>
            <small>
              {isGenerating
                ? "极速档通常更快；公共 GPU 排队时仍可能需要数分钟"
                : `声线设计 + 倍速 + 质量 + 情绪标签 · 当前 ${steps} 步`}
            </small>
          </span>
          <span className="button-arrow" aria-hidden="true">→</span>
        </button>'''
          new_button = '''        <button className="generate-button" type="button" onClick={generate} disabled={!text.trim() || isGenerating}>
          <span className="button-icon" aria-hidden="true">
            {isGenerating ? <i className="spinner" /> : <i className="play-triangle" />}
          </span>
          <span>
            <strong>{isGenerating ? "Edge 预览 + OmniVoice 后台生成中…" : `生成免费双轨语音 · ${speed.toFixed(2)}×`}</strong>
            <small>
              {isGenerating
                ? previewStatus === "ready" ? "Edge 预览已就绪 · OmniVoice 继续在后台生成" : "Edge 正在抢先生成预览 · OmniVoice 已同时启动"
                : `先出 Edge 预览，再出 OmniVoice 最终版 · 当前 ${steps} 步`}
            </small>
          </span>
          <span className="button-arrow" aria-hidden="true">→</span>
        </button>'''
          if old_button not in s:
              raise SystemExit('button marker not found')
          s = s.replace(old_button, new_button)

          final_marker = '        <div className={`result-panel ${audioUrl ? "has-audio" : ""}`} aria-live="polite">'
          preview_panel = '''        {(previewUrl || previewStatus === "generating" || previewStatus === "error") ? (
          <div className={`result-panel ${previewUrl ? "has-audio" : ""}`} aria-live="polite" style={{ marginBottom: 14 }}>
            <div className="result-topline">
              <div>
                <span className="result-dot" />
                <strong>{previewUrl ? "Edge 秒出预览已就绪" : previewStatus === "error" ? "Edge 预览未成功" : "Edge 预览正在生成"}</strong>
              </div>
              <span>{previewUrl ? "可先试听" : "等待几秒"}</span>
            </div>
            {previewUrl ? (
              <div className="audio-ready">
                <audio controls src={previewUrl} preload="metadata">您的浏览器不支持音频播放。</audio>
                <a className="download-link" href={previewUrl} download="qazaq-edge-preview.mp3">
                  <span aria-hidden="true">↓</span>
                  下载预览 MP3
                </a>
              </div>
            ) : (
              <div className="empty-player"><p>{previewStatus === "error" ? "不影响 OmniVoice 最终版继续生成。" : "Edge 免费引擎正在抢先生成可试听版本…"}</p></div>
            )}
          </div>
        ) : null}

'''
          if final_marker not in s:
              raise SystemExit('result marker not found')
          s = s.replace(final_marker, preview_panel + final_marker, 1)
          s = s.replace(
              '<strong>{audioUrl ? "OmniVoice 音频已生成" : "OmniVoice 音频播放器"}</strong>',
              '<strong>{audioUrl ? "OmniVoice 高质量最终版" : "OmniVoice 后台高质量生成"}</strong>',
          )
          s = s.replace(
              '{generatedAt ? <time>{generatedAt}</time> : <span>等待生成</span>}',
              '{generatedAt ? <time>{generatedAt}</time> : <span>{cacheStatus || "等待生成"}</span>}',
          )
          s = s.replace(
              '<p>第二免费引擎生成后，播放器会出现在这里</p>',
              '<p>{isGenerating ? "Edge 预览可先试听，OmniVoice 最终版会在这里自动出现" : "相同文本与参数若已缓存，会直接在这里秒开"}</p>',
          )
          studio.write_text(s)
          PY
      - name: Commit free experience
        run: |
          git config user.name "mahejiang653-maker"
          git config user.email "mahejiang653@gmail.com"
          git add app/api/omnivoice/route.ts app/components/OmniVoiceStudio.tsx
          git commit -m "Add Edge preview warmup and OmniVoice cache"
          git push
