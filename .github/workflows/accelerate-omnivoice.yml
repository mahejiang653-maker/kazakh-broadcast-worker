name: Optimize Edge Naturalness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Optimize Edge naturalness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve Edge TTS prosody
        run: python scripts/optimize_edge_naturalness.py
      - name: Commit Edge naturalness improvements
        run: |
          git config user.name "mahejiang653-maker"
          git config user.email "mahejiang653@gmail.com"
          git add app/api/synthesize/route.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Improve Edge TTS naturalness"
            git push
          fi
