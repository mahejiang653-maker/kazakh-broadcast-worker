name: Implement Free OmniVoice UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Implement free OmniVoice UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply free OmniVoice experience
        run: python scripts/apply_free_omnivoice.py
      - name: Commit implementation
        run: |
          git config user.name "mahejiang653-maker"
          git config user.email "mahejiang653@gmail.com"
          git add app/api/omnivoice/route.ts app/components/OmniVoiceStudio.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Edge preview warmup and OmniVoice cache"
            git push
          fi
