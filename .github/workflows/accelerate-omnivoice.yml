name: Refine Edge Rhythm Prosody

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Refine Edge rhythm prosody'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Edge rhythm pauses emphasis and tone
        run: python scripts/optimize_edge_rhythm_v2.py
      - name: Commit Edge rhythm improvements
        run: |
          git config user.name "mahejiang653-maker"
          git config user.email "mahejiang653@gmail.com"
          git add app/api/synthesize/route.ts
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Refine Edge TTS rhythm pauses and tone"
            git push
          fi
