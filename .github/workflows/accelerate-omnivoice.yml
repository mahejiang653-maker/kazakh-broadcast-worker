name: Accelerate OmniVoice

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add OmniVoice speed optimization workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply speed-first defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          studio = Path('app/components/OmniVoiceStudio.tsx')
          s = studio.read_text()
          s = s.replace(
'''const QUALITY_PRESETS = [
  { id: "fast", label: "快速预览", note: "更快出结果", steps: 12, guidance: 1.6 },
  { id: "standard", label: "标准模式", note: "速度与质量平衡", steps: 16, guidance: 2.0 },
  { id: "quality", label: "高质量", note: "细节更完整", steps: 24, guidance: 2.1 },
  { id: "detail", label: "细腻表现", note: "最慢、表现更细", steps: 32, guidance: 2.3 },
] as const;''',
'''const QUALITY_PRESETS = [
  { id: "fast", label: "极速模式", note: "推荐 · 最快出结果", steps: 8, guidance: 1.3 },
  { id: "standard", label: "标准模式", note: "速度与质量平衡", steps: 12, guidance: 1.6 },
  { id: "quality", label: "高质量", note: "细节更完整", steps: 16, guidance: 2.0 },
  { id: "detail", label: "细腻表现", note: "较慢 · 表现更细", steps: 24, guidance: 2.1 },
] as const;''')
          s = s.replace('const [steps, setSteps] = useState(16);', 'const [steps, setSteps] = useState(8);')
          s = s.replace('const [guidance, setGuidance] = useState(2);', 'const [guidance, setGuidance] = useState(1.3);')
          s = s.replace('const [denoise, setDenoise] = useState(true);', 'const [denoise, setDenoise] = useState(false);')
          s = s.replace('首次使用可能冷启动；短句也可能等待约 1–3 分钟。等待期间请保持网页开启。', '已默认启用 8 步极速档。公共 GPU 仍可能冷启动或排队；不加情绪标签时最快。')
          s = s.replace('越高通常越细腻，但共享 GPU 等待时间也越长', '8 步最快；步数越高通常越细腻，但共享 GPU 等待时间也会明显增加')
          s = s.replace('控制模型对声线设计条件的遵循强度；默认 2.0', '控制模型对声线设计条件的遵循强度；极速默认 1.3')
          s = s.replace('建议保持开启，减少生成噪声', '关闭更快；需要更干净的高质量结果时再开启')
          s = s.replace('可能需要 1–3 分钟或更久，请保持页面开启', '极速档通常更快；公共 GPU 排队时仍可能需要数分钟')
          s = s.replace('例如：Бүгін жақсы жаңалық бар! [开心]。OmniVoice 会把这一句单独用不同倍速、音高或耳语风格生成，再自动合并。公共 GPU 较慢，所以一次最多 3 个标签。', '例如：Бүгін жақсы жаңалық бар! [开心]。每个情绪标签都会增加一次独立 GPU 推理；追求速度时建议先不加标签，最终成稿再添加。一次最多 3 个标签。')
          studio.write_text(s)

          route = Path('app/api/omnivoice/route.ts')
          r = route.read_text()
          r = r.replace('Math.round(steps) : 16;', 'Math.round(steps) : 8;')
          r = r.replace('guidance : 2;', 'guidance : 1.3;')
          r = r.replace('denoise : true;', 'denoise : false;')
          route.write_text(r)
          PY
      - name: Commit speed optimization
        run: |
          git config user.name "mahejiang653-maker"
          git config user.email "mahejiang653@gmail.com"
          git add app/components/OmniVoiceStudio.tsx app/api/omnivoice/route.ts
          git commit -m "Speed up OmniVoice defaults"
          git push
