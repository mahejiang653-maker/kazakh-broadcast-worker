name: Verify 2026-09-06 News Globe
on:
  push:
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, 'VERIFY_GLOBE_20260906')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run full Top1 to Top13 browser verification
        run: |
          mkdir -p globe-verify
          cat > verify-globe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://kazakh-broadcast-worker.mahejiang653.workers.dev/news-globe-run-20260906.html';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.message));
          let loaded=false;
          for(let i=0;i<30&&!loaded;i++){
            try{const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});if(r&&r.ok()){loaded=true;break}}catch{}
            await page.waitForTimeout(10000);
          }
          if(!loaded) throw new Error('Deployed daily page did not become reachable');
          await page.waitForSelector('iframe#base',{timeout:60000});
          let frame=null;
          const frameDeadline=Date.now()+60000;
          while(Date.now()<frameDeadline&&!frame){
            frame=page.frames().find(f=>f.url().includes('news-globe-run-20260906-v34'))||null;
            if(!frame) await page.waitForTimeout(500);
          }
          if(!frame) throw new Error('V43 did not load 20260906 V34 base');
          await frame.waitForFunction(()=>window.NG14?.news?.length===13 && window.NG14?.viewer,{timeout:90000});
          const data=await frame.evaluate(()=>({date:window.NG14.meta?.date,len:window.NG14.news?.length,titles:window.NG14.news?.map(x=>x.title)}));
          if(data.date!=='2026-09-06'||data.len!==13) throw new Error('Wrong daily data '+JSON.stringify(data));
          await frame.evaluate(()=>window.NG14.pause?.());
          const seen=[];
          for(let i=0;i<13;i++){
            const duration=await frame.evaluate((idx)=>{
              const G=window.NG14;
              G.pause?.();
              G.focus(idx,true);
              return Number(G.storyDuration?.(G.news[idx])||19000);
            },i);
            await page.waitForTimeout(Math.max(22500,duration+5000));
            const state=await frame.evaluate(()=>({
              current:window.NG14.current+1,
              title:document.querySelector('#title')?.textContent||'',
              location:document.querySelector('#location')?.textContent||'',
              viewer:!!window.NG14.viewer,
              sceneDestroyed:window.NG14.viewer?.scene?.isDestroyed?.()||false,
              cameraHeight:window.NG14.viewer?.camera?.positionCartographic?.height||0
            }));
            if(state.current!==i+1) throw new Error(`Top${i+1} current mismatch: ${JSON.stringify(state)}`);
            if(state.title!==data.titles[i]) throw new Error(`Top${i+1} title mismatch: ${JSON.stringify(state)}`);
            if(!state.location) throw new Error(`Top${i+1} missing location`);
            if(!state.viewer||state.sceneDestroyed||!Number.isFinite(state.cameraHeight)||state.cameraHeight<=0) throw new Error(`Top${i+1} Cesium failure: ${JSON.stringify(state)}`);
            seen.push({top:i+1,title:state.title,location:state.location,cameraHeight:state.cameraHeight});
            await page.screenshot({path:`globe-verify/top-${String(i+1).padStart(2,'0')}.png`,fullPage:true});
          }
          const final=await frame.evaluate(()=>({current:window.NG14.current+1,title:document.querySelector('#title')?.textContent||'',newsLen:window.NG14.news.length,date:window.NG14.meta.date}));
          fs.writeFileSync('globe-verify/report.json',JSON.stringify({url,data,seen,final,pageErrors},null,2));
          if(seen.length!==13||final.current!==13||final.newsLen!==13||final.date!=='2026-09-06') throw new Error('Did not complete 13/13 '+JSON.stringify({seen:seen.length,final}));
          if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
          await browser.close();
          console.log(JSON.stringify({status:'PASS',seen:seen.length,final},null,2));
          EOF
          node verify-globe.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-globe-20260906-verification
          path: globe-verify
