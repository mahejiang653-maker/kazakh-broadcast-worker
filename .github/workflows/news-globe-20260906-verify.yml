name: Verify 2026-09-06 News Globe
on:
  push:
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, 'VERIFY_GLOBE_20260906')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run full Top1 to Top13 browser verification
        run: |
          mkdir -p globe-verify
          cat > verify-globe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const url='https://kazakh-broadcast-worker.mahejiang653.workers.dev/news-globe-run-20260906.html';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
          let loaded=false;
          for(let i=0;i<30&&!loaded;i++){
            try{const r=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});if(r&&r.ok()){loaded=true;break}}catch{}
            await page.waitForTimeout(10000);
          }
          if(!loaded) throw new Error('Deployed daily page did not become reachable');
          await page.waitForSelector('iframe#base',{timeout:60000});
          let frame=null;
          const frameDeadline=Date.now()+60000;
          while(Date.now()<frameDeadline&&!frame){
            frame=page.frames().find(f=>f.url().includes('news-globe-run-20260906-v34'))||null;
            if(!frame)await page.waitForTimeout(500);
          }
          if(!frame) throw new Error('V43 did not load 20260906 V34 base; frames='+page.frames().map(f=>f.url()).join(' | '));
          await frame.waitForFunction(()=>window.NG14?.news?.length===13 && window.NG14?.viewer,{timeout:90000});
          const data=await frame.evaluate(()=>({date:window.NG14.meta?.date,len:window.NG14.news?.length,titles:window.NG14.news?.map(x=>x.title)}));
          if(data.date!=='2026-09-06'||data.len!==13) throw new Error('Wrong daily data '+JSON.stringify(data));
          await frame.evaluate(()=>window.NG14.pause?.());
          const seen=[];
          for(let i=0;i<13;i++){
            const expected=i+1;
            const duration=await frame.evaluate((idx)=>{
              const G=window.NG14;G.pause?.();G.focus(idx,true);return G.storyDuration(G.news[idx]);
            },i);
            await page.waitForTimeout(Math.max(22000,duration+3500));
            const state=await frame.evaluate(()=>({
              count:document.querySelector('#count')?.textContent||'',
              title:document.querySelector('#title')?.textContent||'',
              loc:document.querySelector('#location')?.textContent||'',
              current:window.NG14.current+1,
              viewer:!!window.NG14.viewer,
              sceneDestroyed:window.NG14.viewer?.scene?.isDestroyed?.()||false,
              activeIso:window.NG14.activeIso||'',
              localCount:window.NG14.localHighlightEntities?.length||0
            }));
            const k=Number(/^(\d+)\s*\/\s*13$/.exec(state.count.trim())?.[1]||0);
            if(k!==expected||state.current!==expected) throw new Error(`Sequence break expected ${expected} got ${JSON.stringify(state)}`);
            if(!state.viewer||state.sceneDestroyed) throw new Error(`Cesium render failure at Top${expected}: ${JSON.stringify(state)}`);
            if(!state.title||!state.loc) throw new Error(`Missing story display at Top${expected}: ${JSON.stringify(state)}`);
            seen.push({top:expected,title:state.title,location:state.loc,activeIso:state.activeIso,localCount:state.localCount});
            await page.screenshot({path:`globe-verify/top-${String(expected).padStart(2,'0')}.png`,fullPage:true});
          }
          if(seen.length!==13) throw new Error('Playback did not reach 13/13: '+JSON.stringify(seen));
          const final=await frame.evaluate(()=>({current:window.NG14.current+1,title:document.querySelector('#title')?.textContent||'',newsLen:window.NG14.news.length,date:window.NG14.meta.date}));
          fs.writeFileSync('globe-verify/report.json',JSON.stringify({url,data,seen,final,errors},null,2));
          const blocking=errors.filter(x=>!/favicon|Failed to load resource.*404/i.test(x));
          if(blocking.length)throw new Error('Browser errors: '+blocking.join(' | '));
          await browser.close();console.log(JSON.stringify({status:'PASS',seen:seen.length,final},null,2));
          EOF
          node verify-globe.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-globe-20260906-verification
          path: globe-verify
