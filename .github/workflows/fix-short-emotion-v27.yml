name: Fix short emotion V27

on:
  push:
    paths:
      - '.github/workflows/fix-short-emotion-v27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore coarse emotion boundaries
        run: python .github/scripts/fix-short-emotion-v27.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-story-emotion-trajectory.ts
          git commit -m "Restore stable short-form emotion boundaries"
          git push
