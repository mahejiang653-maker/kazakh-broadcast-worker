name: Edge discourse memory V3

on:
  push:
    paths:
      - '.deploy-edge-discourse-memory-v3'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply discourse memory V3
        run: python .github/scripts/edge-discourse-memory-v3.py

      - name: Commit patch
        run: |
          rm -f .deploy-edge-discourse-memory-v3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-director.ts app/lib/edge-omnivoice-inspired.ts .deploy-edge-discourse-memory-v3
          git commit -m "Add conservative discourse memory prosody"
          git push
