name: Long emotion analysis V25

on:
  push:
    paths:
      - '.github/workflows/long-emotion-analysis-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V25 long emotion analysis patch
        run: python .github/scripts/long-emotion-analysis-v25.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-story-emotion-trajectory.ts app/lib/edge-emotion-director.ts app/api/edge-emotion-analysis/route.ts
          git commit -m "Optimize long-form emotion analysis"
          git push
