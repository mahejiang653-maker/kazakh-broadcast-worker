name: Terminal linebreak V30

on:
  push:
    paths:
      - '.github/workflows/terminal-linebreak-v30.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V30 terminal linebreak patch
        run: python .github/scripts/terminal-linebreak-v30.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Preserve terminal linebreak paragraph cadence"
          git push
