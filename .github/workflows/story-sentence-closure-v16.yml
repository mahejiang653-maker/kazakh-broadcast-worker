name: Story sentence closure V16

on:
  push:
    paths:
      - '.deploy-story-sentence-closure-v16'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V16 story sentence closure patch
        run: python .github/scripts/story-sentence-closure-v16.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .deploy-story-sentence-closure-v16
          git add app/lib/edge-omnivoice-inspired.ts .deploy-story-sentence-closure-v16
          git commit -m "Restore story sentence closure cues"
          git push
