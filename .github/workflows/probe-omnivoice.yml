name: Integrate OmniVoice Studio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-omnivoice.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage and clean probe workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text()

          import_line = 'import { useEffect, useMemo, useRef, useState } from "react";\n'
          omni_import = 'import OmniVoiceStudio from "./components/OmniVoiceStudio";\n'
          if omni_import not in text:
              if import_line not in text:
                  raise SystemExit('React import anchor not found')
              text = text.replace(import_line, import_line + omni_import, 1)

          anchor = '        </section>\n      </section>\n\n      <footer>'
          replacement = '        </section>\n      </section>\n\n      <OmniVoiceStudio sourceText={text} />\n\n      <footer>'
          if '<OmniVoiceStudio sourceText={text} />' not in text:
              if anchor not in text:
                  raise SystemExit('Homepage insertion anchor not found')
              text = text.replace(anchor, replacement, 1)

          old_footer = '免费模式基于 Edge TTS 开源通道 · 高质量模式使用 ElevenLabs v3 · API Key 仅保存在 Cloudflare 服务端 · {" "}'
          new_footer = '免费模式一基于 Edge TTS · 免费模式二使用 KazakhTTS-OmniVoice 公共 Demo · 高质量模式使用 ElevenLabs v3 · API Key 仅保存在 Cloudflare 服务端 · {" "}'
          text = text.replace(old_footer, new_footer)
          path.write_text(text)
          PY

          git config user.name "mahejiang653-maker"
          git config user.email "mahejiang653@gmail.com"
          git rm .github/workflows/probe-omnivoice.yml
          git add app/page.tsx
          git commit -m "Add OmniVoice as second free TTS studio"
          git push origin HEAD:main
