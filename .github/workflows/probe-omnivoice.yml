name: Probe OmniVoice Space

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-omnivoice.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Gradio API
        shell: bash
        run: |
          BASE='https://shyngys879-kazakhtts-omnivoice-demo.hf.space'
          curl -L --max-time 90 -sS "$BASE/gradio_api/info" -o /tmp/info
          python - <<'PY'
          import json
          info=json.load(open('/tmp/info'))
          for name, spec in info.get('named_endpoints', {}).items():
              print('ENDPOINT', name)
              print('PARAMS')
              for p in spec.get('parameters', []):
                  print('-', p.get('parameter_name'), '| label=', p.get('label'), '| default=', repr(p.get('parameter_default')), '| component=', p.get('component'))
              print('RETURNS')
              for r in spec.get('returns', []):
                  print('-', r.get('label'), '| component=', r.get('component'), '| type=', r.get('python_type'))
              print()
          PY
