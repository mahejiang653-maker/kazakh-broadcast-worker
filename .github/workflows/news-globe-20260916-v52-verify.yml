name: Verify Globe V52 Daily
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'VERIFY_GLOBE_20260916_V52') || contains(github.event.head_commit.message, 'VERIFY_GLOBE_20260917_V52')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Run daily verifier
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"VERIFY_GLOBE_20260917_V52"* ]]; then
            node .github/scripts/verify-20260917-v52.mjs
          else
            node .github/scripts/verify-20260916-v52.mjs
          fi
