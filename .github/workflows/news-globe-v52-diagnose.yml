name: Diagnose V52 browser error
on:
  push:
permissions:
  contents: read
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'DIAGNOSE_GLOBE_V52')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install chromium
      - name: Capture page error source
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:1440,height:900}});
          p.on('pageerror',e=>console.log('PAGEERROR_MESSAGE='+e.message+'\nPAGEERROR_STACK='+e.stack));
          p.on('console',m=>{if(m.type()==='error') console.log('CONSOLE_ERROR='+m.text())});
          await p.goto('https://kazakh-broadcast-worker.mahejiang653.workers.dev/news-globe-run-20260907.html',{waitUntil:'networkidle',timeout:90000});
          await p.waitForTimeout(12000);
          await b.close();
          EOF
          node diag.mjs
