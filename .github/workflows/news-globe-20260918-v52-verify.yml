name: Verify 2026-09-18 Globe V52
on:
  push:
    branches: [main]
    paths:
      - 'public/news-globe-data-20260918-v52-r1.js'
      - 'public/news-globe-run-20260918-v52-r1.html'
      - '.github/scripts/verify-20260918-v52.mjs'
      - '.github/workflows/news-globe-20260918-v52-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: node .github/scripts/verify-20260918-v52.mjs
