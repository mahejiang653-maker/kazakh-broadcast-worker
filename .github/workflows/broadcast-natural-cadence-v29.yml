name: Broadcast natural cadence V29

on:
  push:
    paths:
      - '.github/workflows/broadcast-natural-cadence-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V29 broadcast cadence patch
        run: python .github/scripts/broadcast-natural-cadence-v29.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Refine all broadcast modes with natural cadence"
          git push
