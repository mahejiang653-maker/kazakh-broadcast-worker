name: Edge lossless segmentation V36

on:
  push:
    paths:
      - '.github/workflows/edge-lossless-segmentation-v36.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply V36 lossless Edge segmentation patch
        run: python .github/scripts/edge-lossless-segmentation-v36.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/edge-omnivoice-inspired.ts
          git commit -m "Use lossless dependency-aware Edge segmentation"
          git push
