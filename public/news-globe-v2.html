<style>
:root{--line:rgba(100,210,255,.25);--text:#f4f8fb;--muted:#91a8b9;--cyan:#66ddff;--gold:#ffd36b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,textarea{font:inherit}#app,#globe{position:absolute;inset:0}.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 52% 42%,transparent 0 34%,rgba(1,6,13,.16) 65%,rgba(1,6,13,.66) 100%),linear-gradient(0deg,rgba(0,7,15,.70),transparent 24%)}.card{border:1px solid var(--line);background:rgba(4,12,24,.76);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.top{position:absolute;z-index:4;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px}.brand{padding:10px 13px;border-radius:13px}.brand small{display:block;color:var(--cyan);font-size:9px;letter-spacing:.18em}.brand strong{display:block;margin-top:3px;font-size:15px}.brand span{display:block;margin-top:2px;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px;align-items:center}.status,.actions button,.bottom button,.drawer button{border:1px solid var(--line);background:rgba(17,35,54,.85);color:var(--text);border-radius:9px;min-height:40px;padding:0 11px}.status{display:flex;align-items:center;font-size:10px;color:#c8f5ff}.panel{position:absolute;z-index:4;left:16px;top:88px;width:min(355px,calc(100vw - 32px));max-height:calc(100vh - 180px);display:flex;flex-direction:column;border-radius:16px;overflow:hidden}.current{padding:15px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;color:var(--cyan);letter-spacing:.14em}.current h1{font-size:18px;line-height:1.35;margin:7px 0 9px}.meta{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:10px;color:#c4d3df;border:1px solid var(--line);border-radius:999px;padding:4px 7px;background:rgba(11,26,44,.65)}.summary{font-size:12px;line-height:1.62;color:#c8d6e2;margin-top:9px}.list{padding:7px;overflow:auto}.story{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;border:0;background:transparent;color:var(--text);text-align:left;padding:8px;border-radius:9px}.story.active{background:rgba(97,220,255,.12);outline:1px solid rgba(97,220,255,.24)}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;border:1px solid rgba(97,220,255,.35);background:rgba(17,54,78,.43)}.story.active .num{background:var(--cyan);color:#03202a}.story-title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.story-loc{font-size:9px;color:var(--muted);margin-top:2px}.dot{width:6px;height:6px;border-radius:50%;background:#40566a}.story.visited .dot{background:var(--cyan)}.story.active .dot{background:var(--gold)}.right{position:absolute;z-index:4;right:16px;top:88px;display:flex;flex-direction:column;gap:9px;align-items:flex-end}.badge,.note{border-radius:11px;padding:10px 11px}.badge strong{display:block;font-size:24px;text-align:right}.badge span{font-size:9px;color:var(--muted)}.note{max-width:260px;color:var(--muted);font-size:9px;line-height:1.55}.bottom{position:absolute;z-index:5;left:50%;bottom:14px;transform:translateX(-50%);width:min(790px,calc(100vw - 24px));border-radius:14px;padding:8px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.controls{display:flex;gap:6px}.bottom button.primary{background:rgba(39,125,160,.7)}.timeline{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}.timeline button{height:9px;min-height:0;width:100%;padding:0;border:0;border-radius:99px;background:#263a4a}.timeline button.visited{background:#3bbef0}.timeline button.active{background:var(--gold)}.count{font-size:10px;color:var(--muted)}.overview{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;pointer-events:none;transition:.3s;text-shadow:0 2px 20px #000}.overview.show{opacity:1}.overview strong{display:block;font-size:28px;letter-spacing:.12em}.overview span{display:block;margin-top:6px;font-size:11px;color:#d4e2ec}.drawer-backdrop{position:absolute;z-index:20;inset:0;background:rgba(0,5,12,.75);display:none;align-items:center;justify-content:center;padding:16px}.drawer-backdrop.show{display:flex}.drawer{width:min(680px,100%);max-height:88%;overflow:auto;border-radius:16px;padding:16px}.drawer h2{margin:0 0 5px;font-size:18px}.drawer p{font-size:12px;color:var(--muted);line-height:1.55}.drawer label{display:block;font-size:11px;color:#c7d7e3;margin:10px 0 5px}.drawer input,.drawer textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#07131f;color:var(--text);padding:10px;font-size:16px}.drawer textarea{min-height:260px;font:12px/1.5 ui-monospace,Consolas,monospace}.drawer-buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.drawer .primary{background:#175f80}.msg{white-space:pre-wrap;margin-top:9px;color:#bfeeff;font-size:11px;line-height:1.55}.cesium-viewer-bottom{right:8px!important;bottom:68px!important}
@media(max-width:760px){.top{left:10px;right:10px;top:8px}.brand strong{font-size:13px}.brand span,.status{display:none}.panel{left:10px;top:auto;bottom:72px;width:calc(100vw - 20px);max-height:38vh}.current{padding:12px}.current h1{font-size:16px}.summary{font-size:11px}.list,.right{display:none}.bottom{bottom:8px;width:calc(100vw - 16px);grid-template-columns:auto 1fr}.timeline{grid-column:1/-1;order:3}.count{display:none}.bottom button,.actions button{min-height:38px;padding:0 9px}.cesium-viewer-bottom{bottom:120px!important}}
</style></head>
<body><div id="app"><div id="globe"></div><div class="shade"></div>
<header class="top"><div class="brand card"><small>DAILY GLOBAL NEWS GLOBE</small><strong>全球新闻 · 十三地定位</strong><span>真实卫星地表 · 官方边界可选叠加</span></div><div class="actions"><div id="mapStatus" class="status">加载地球中…</div><button id="settingsBtn">设置 / 导入</button></div></header>
<aside class="panel card"><section class="current"><div id="eyebrow" class="eyebrow">TOP 01 / 13</div><h1 id="title">正在加载…</h1><div class="meta"><span id="location" class="chip">—</span><span id="region" class="chip">—</span><span id="date" class="chip">—</span><span id="placeType" class="chip">—</span></div><div id="summary" class="summary"></div></section><div id="list" class="list"></div></aside>
<section class="right"><div class="badge card"><strong>13</strong><span>DAILY STORIES</span></div><div id="modeNote" class="note card">无 Key 时使用卫星影像地表，不显示任何政治边界；有天地图 Key 时才叠加官方境界。</div></section>
<div id="overview" class="overview"><strong>13 STORIES · ONE WORLD</strong><span>今日十三条新闻发生地总览</span></div>
<nav class="bottom card"><div class="controls"><button id="prev">◀</button><button id="play" class="primary">播放</button><button id="next">▶</button><button id="all">总览</button></div><div id="timeline" class="timeline"></div><div id="count" class="count">01 / 13</div></nav>
<div id="drawerBackdrop" class="drawer-backdrop"><section class="drawer card"><h2>设置 / 导入</h2><p>没有天地图 Key 也能直接使用真实卫星地球。只有你以后拿到官方 Key 时，才需要填写下面一栏以启用天地图官方境界。</p><label>天地图浏览器端 Key（可留空）</label><input id="tokenInput" type="password" autocomplete="off"><label>今日 13 条新闻 JSON</label><textarea id="jsonInput" spellcheck="false"></textarea><div class="drawer-buttons"><button id="sampleBtn">载入模板</button><button id="applyBtn" class="primary">保存并应用</button><button id="closeBtn">关闭</button></div><div id="msg" class="msg"></div></section></div></div>
<script>
(async()=>{const $=id=>document.getElementById(id),DATA_KEY="news-globe-v2-data",TOKEN_KEY="news-globe-v2-tdt";const today=new Date().toISOString().slice(0,10);const demo=[["北京","中国",116.4074,39.9042],["东京","东亚",139.6917,35.6895],["首尔","东亚",126.978,37.5665],["新加坡","东南亚",103.8198,1.3521],["新德里","南亚",77.209,28.6139],["莫斯科","欧洲",37.6173,55.7558],["布鲁塞尔","欧洲",4.3517,50.8503],["开罗","北非",31.2357,30.0444],["内罗毕","东非",36.8219,-1.2921],["华盛顿特区","北美洲",-77.0369,38.9072],["墨西哥城","北美洲",-99.1332,19.4326],["巴西利亚","南美洲",-47.8825,-15.7942],["悉尼","大洋洲",151.2093,-33.8688]].map((x,i)=>({id:i+1,title:`演示新闻 ${i+1}｜请导入当天标题`,location:x[0],region:x[1],placeType:"演示地点",date:today,lon:x[2],lat:x[3],height:2200000,summary:"这里显示当天新闻摘要。"}));function loadStored(){try{const x=JSON.parse(localStorage.getItem(DATA_KEY)||"null");return x&&Array.isArray(x.news)?x:null}catch{return null}}let payload=loadStored()||{meta:{date:today,edition:"demo"},news:demo},news=payload.news,meta=payload.meta||{},viewer,current=0,playing=false,timer=null,pulsePhase=0,markers=[],pulses=[],arcs=[],tdtToken="";
function validate(p){const e=[];if(!p||typeof p!=="object")return["JSON根对象无效"];if(!Array.isArray(p.news))return["缺少 news 数组"];if(p.news.length!==13)e.push(`必须正好13条，当前${p.news.length}条`);const ids=new Set();p.news.forEach((n,i)=>{const q=`第${i+1}条`,id=Number(n?.id),lon=Number(n?.lon),lat=Number(n?.lat);if(!String(n?.title||"").trim())e.push(q+"缺少标题");if(!String(n?.location||"").trim())e.push(q+"缺少地点");if(!Number.isInteger(id)||id<1||id>13)e.push(q+" id必须1–13");if(ids.has(id))e.push(q+" id重复");ids.add(id);if(!Number.isFinite(lon)||lon<-180||lon>180)e.push(q+"经度无效");if(!Number.isFinite(lat)||lat<-90||lat>90)e.push(q+"纬度无效")});return e}
async function getServerToken(){try{const r=await fetch('/api/globe-config',{cache:'no-store'}),j=await r.json();return String(j.tiandituToken||'').trim()}catch{return''}}
function addTdt(code,alpha=1){const p=new Cesium.WebMapTileServiceImageryProvider({url:`https://t0.tianditu.gov.cn/${code}_w/wmts?tk=${encodeURIComponent(tdtToken)}`,layer:code,style:'default',format:'tiles',tileMatrixSetID:'w',tileMatrixLabels:Array.from({length:19},(_,i)=>String(i+1)),tilingScheme:new Cesium.WebMercatorTilingScheme(),maximumLevel:18,enablePickFeatures:false,credit:new Cesium.Credit('天地图')});const l=viewer.imageryLayers.addImageryProvider(p);l.alpha=alpha}
async function addSatellite(){try{const p=await Cesium.ArcGisMapServerImageryProvider.fromUrl('https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer');viewer.imageryLayers.addImageryProvider(p);return true}catch(e){console.warn(e);const p=new Cesium.UrlTemplateImageryProvider({url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',tilingScheme:new Cesium.WebMercatorTilingScheme(),maximumLevel:19,credit:new Cesium.Credit('Esri World Imagery')});viewer.imageryLayers.addImageryProvider(p);return true}}
async function initViewer(){viewer=new Cesium.Viewer('globe',{baseLayer:false,animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,selectionIndicator:false,shouldAnimate:true});viewer.imageryLayers.removeAll();viewer.scene.backgroundColor=Cesium.Color.fromCssColorString('#02060d');viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString('#07111e');viewer.scene.globe.enableLighting=true;viewer.scene.globe.showGroundAtmosphere=true;viewer.scene.globe.depthTestAgainstTerrain=true;viewer.scene.skyAtmosphere.show=true;viewer.scene.fog.enabled=true;viewer.scene.screenSpaceCameraController.minimumZoomDistance=500000;viewer.scene.screenSpaceCameraController.maximumZoomDistance=35000000;tdtToken=(await getServerToken())||localStorage.getItem(TOKEN_KEY)||'';if(tdtToken){addTdt('img',1);addTdt('ibo',1);addTdt('cia',.96);$('mapStatus').textContent='天地图官方境界模式'}else{await addSatellite();$('mapStatus').textContent='真实卫星地表 · 无国界线'}viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(95,22,16000000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-90),roll:0}})}
function clearScene(){[...markers,...pulses,...arcs].forEach(e=>viewer.entities.remove(e));markers=[];pulses=[];arcs=[]}function arc(a,b){let x=+a.lon,y=+a.lat,x2=+b.lon,y2=+b.lat,d=x2-x;if(d>180)d-=360;if(d<-180)d+=360;const c=[];for(let s=0;s<=64;s++){const t=s/64;let lon=x+d*t;if(lon>180)lon-=360;if(lon<-180)lon+=360;const lat=y+(y2-y)*t,h=800000*Math.sin(Math.PI*t)+30000;c.push(lon,lat,h)}return viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights(c),width:2,show:false,material:new Cesium.PolylineGlowMaterialProperty({glowPower:.22,color:Cesium.Color.fromCssColorString('#48cfff').withAlpha(.82)})}})}
function buildScene(){clearScene();news.forEach((n,i)=>{const pos=Cesium.Cartesian3.fromDegrees(+n.lon,+n.lat,1200);markers.push(viewer.entities.add({position:pos,point:{pixelSize:8,color:Cesium.Color.fromCssColorString('#61dcff').withAlpha(.38),outlineColor:Cesium.Color.WHITE.withAlpha(.35),outlineWidth:1},label:{text:String(i+1).padStart(2,'0'),font:'700 13px sans-serif',fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(0,-26),showBackground:true,backgroundColor:Cesium.Color.fromCssColorString('#071521').withAlpha(.88),backgroundPadding:new Cesium.Cartesian2(7,5),show:false}}));pulses.push(viewer.entities.add({position:pos,ellipse:{semiMajorAxis:new Cesium.CallbackProperty(()=>i===current?50000+((Math.sin(pulsePhase)+1)/2)*100000:1,false),semiMinorAxis:new Cesium.CallbackProperty(()=>i===current?50000+((Math.sin(pulsePhase)+1)/2)*100000:1,false),material:new Cesium.ColorMaterialProperty(new Cesium.CallbackProperty(()=>i===current?Cesium.Color.fromCssColorString('#61dcff').withAlpha(.18):Cesium.Color.TRANSPARENT,false)),outline:true,outlineColor:new Cesium.CallbackProperty(()=>i===current?Cesium.Color.fromCssColorString('#61dcff').withAlpha(.55):Cesium.Color.TRANSPARENT,false)}}))});for(let i=0;i<12;i++)arcs.push(arc(news[i],news[i+1]))}
function updateOcclusion(){if(!viewer||!markers.length)return;const occluder=new Cesium.EllipsoidalOccluder(Cesium.Ellipsoid.WGS84,viewer.camera.positionWC);const time=viewer.clock.currentTime;markers.forEach((e,i)=>{const pos=e.position&&e.position.getValue(time);const visible=!!pos&&occluder.isPointVisible(pos);e.show=visible;if(pulses[i])pulses[i].show=visible})}
function buildUI(){$('list').innerHTML='';$('timeline').innerHTML='';news.forEach((n,i)=>{const b=document.createElement('button');b.className='story';b.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')}</div><div><div class="story-title"></div><div class="story-loc"></div></div><div class="dot"></div>`;b.querySelector('.story-title').textContent=n.title;b.querySelector('.story-loc').textContent=`${n.location} · ${n.region||''}`;b.onclick=()=>{pause();showStory(i,true)};$('list').appendChild(b);const t=document.createElement('button');t.onclick=()=>{pause();showStory(i,true)};$('timeline').appendChild(t)})}
function restyle(){markers.forEach((e,i)=>{const a=i===current,v=i<current;e.point.pixelSize=a?18:(v?9:7);e.point.color=a?Cesium.Color.fromCssColorString('#ffd36b'):(v?Cesium.Color.fromCssColorString('#61dcff').withAlpha(.70):Cesium.Color.fromCssColorString('#61dcff').withAlpha(.32));e.label.show=a});arcs.forEach((e,i)=>e.polyline.show=i<current);[...document.querySelectorAll('.story')].forEach((e,i)=>{e.classList.toggle('active',i===current);e.classList.toggle('visited',i<current)});[...$('timeline').children].forEach((e,i)=>{e.classList.toggle('active',i===current);e.classList.toggle('visited',i<current)});updateOcclusion()}
function showStory(i,fly=true){$('overview').classList.remove('show');current=(i+13)%13;const n=news[current];$('eyebrow').textContent=`TOP ${String(current+1).padStart(2,'0')} / 13`;$('title').textContent=n.title;$('location').textContent=n.location;$('region').textContent=n.region||'';$('date').textContent=n.date||meta.date||'';$('placeType').textContent=n.placeType||'新闻发生地';$('summary').textContent=n.summary||'';$('count').textContent=`${String(current+1).padStart(2,'0')} / 13`;restyle();if(fly)viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(+n.lon,+n.lat,Math.max(1200000,Math.min(7000000,Number(n.height||2200000)))),orientation:{heading:Cesium.Math.toRadians(Number(n.heading||0)),pitch:Cesium.Math.toRadians(Number(n.pitch||-72)),roll:0},duration:1.9,easingFunction:Cesium.EasingFunction.QUADRATIC_IN_OUT})}
function overview(){pause();markers.forEach(e=>{e.point.pixelSize=10;e.label.show=true});arcs.forEach(e=>e.polyline.show=true);$('overview').classList.add('show');viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(85,10,21000000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-90),roll:0},duration:2.2})}function pause(){playing=false;if(timer)clearTimeout(timer);timer=null;$('play').textContent='播放'}function play(){if(playing)return;playing=true;$('play').textContent='暂停';const step=()=>{if(!playing)return;timer=setTimeout(()=>{if(current===12){overview();return}showStory(current+1,true);step()},7600)};step()}
function openSettings(){$('drawerBackdrop').classList.add('show');$('tokenInput').value=localStorage.getItem(TOKEN_KEY)||'';$('jsonInput').value=JSON.stringify(payload,null,2)}function closeSettings(){$('drawerBackdrop').classList.remove('show')}function applySettings(){let p;try{p=JSON.parse($('jsonInput').value)}catch(e){$('msg').textContent='JSON格式错误：'+e.message;return}const er=validate(p);if(er.length){$('msg').textContent='未通过：\n- '+er.join('\n- ');return}const k=$('tokenInput').value.trim();if(k)localStorage.setItem(TOKEN_KEY,k);else localStorage.removeItem(TOKEN_KEY);localStorage.setItem(DATA_KEY,JSON.stringify(p));payload=p;news=p.news;meta=p.meta||{};buildScene();buildUI();showStory(0,false);$('msg').textContent='已保存并应用。刷新页面后可切换地图模式。'}
$('settingsBtn').onclick=openSettings;$('closeBtn').onclick=closeSettings;$('sampleBtn').onclick=()=>{$('jsonInput').value=JSON.stringify({meta:{date:today,edition:'daily-13'},news:demo},null,2)};$('applyBtn').onclick=applySettings;$('prev').onclick=()=>{pause();showStory(current-1,true)};$('next').onclick=()=>{pause();showStory(current+1,true)};$('play').onclick=()=>playing?pause():play();$('all').onclick=overview;$('drawerBackdrop').onclick=e=>{if(e.target===$('drawerBackdrop'))closeSettings()};await initViewer();buildScene();buildUI();showStory(0,false);let last=performance.now();(function anim(){const now=performance.now(),dt=Math.min(60,now-last);last=now;pulsePhase+=dt*.0045;updateOcclusion();if(viewer&&!playing&&!$('overview').classList.contains('show'))viewer.camera.rotateRight(.000009*dt);requestAnimationFrame(anim)})()})();
</script></body></html>
